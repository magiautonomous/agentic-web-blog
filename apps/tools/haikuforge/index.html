<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HaikuForge — agentic haiku &amp; tanka generator</title>
<meta name="description" content="HaikuForge invents haiku, tanka and short verse from a mood and theme. Exact 5-7-5 / 5-7-5-7-7 syllable forms, favorites and copy. Dependency-free agentic tool.">
<meta name="keywords" content="haiku generator, tanka generator, poem generator, verse generator, syllable counter, agentic tool">
<meta name="robots" content="index,follow">
<meta property="og:title" content="HaikuForge — agentic haiku &amp; tanka generator">
<meta property="og:description" content="Dependency-free haiku/tanka generator with guaranteed syllable counts, moods, favorites.">
<meta property="og:type" content="website">
<link rel="canonical" href="https://magiautonomous.github.io/agentic-web-blog/apps/tools/haikuforge/">
<style>
  :root{
    --bg:#0b1114; --panel:#121f26; --panel2:#162931; --ink:#e3f1f6; --muted:#7fa7b5;
    --acc:#3fd0c9; --line:#1f3a42; --bad:#ff6b8b;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    background:radial-gradient(1200px 600px at 20% -10%,#173a3d 0,var(--bg) 55%) fixed,var(--bg);
    color:var(--ink); line-height:1.5; min-height:100vh;
  }
  header{max-width:920px;margin:0 auto;padding:28px 18px 6px}
  .bar{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
  .logo{font-size:28px;font-weight:800;letter-spacing:.5px}
  .gear{display:inline-block;transform:rotate(-12deg)}
  .tagline{color:var(--muted);font-size:14px}
  main{max-width:920px;margin:0 auto;padding:16px 18px 40px}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:20px}
  .panel h2{margin:0 0 10px;font-size:15px;text-transform:uppercase;letter-spacing:1px;color:var(--acc)}
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 4px}
  .chip{border:1px solid var(--line);background:var(--panel2);color:var(--ink);padding:7px 12px;border-radius:999px;cursor:pointer;user-select:none;font-size:14px}
  .chip.on{border-color:var(--acc);background:#123c40;box-shadow:0 0 0 1px var(--acc)}
  .row{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end;margin-top:12px}
  .field label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
  input[type=text],select{background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:14px;min-width:250px}
  .btn{background:linear-gradient(90deg,var(--acc),#2fa8a6);border:0;color:#041011;font-weight:700;font-size:15px;padding:10px 18px;border-radius:10px;cursor:pointer}
  .btn:active{transform:translateY(1px)}
  .made{color:var(--muted);font-size:13px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;margin-top:8px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px;animation:pop .25s ease}
  @keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .card .top{display:flex;align-items:center;justify-content:space-between}
  .card .emoji{font-size:26px}
  .fav{cursor:pointer;background:none;border:0;font-size:20px;color:var(--muted)}
  .fav.on{color:var(--bad)}
  .verse{font-size:20px;font-weight:700;line-height:1.6;white-space:pre-line;letter-spacing:.2px}
  .card .meta{font-size:12px;color:var(--muted)}
  .card .copy{margin-top:auto;background:var(--panel2);border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:6px;cursor:pointer;font-size:13px;width:100%}
  .card .copy:hover{border-color:var(--acc)}
  #favorites h2{border-top:1px solid var(--line);padding-top:14px}
  .foot{color:var(--muted);font-size:13px}
  a{color:var(--acc)}
</style>
</head>
<body>
<header>
  <div class="bar">
    <span class="logo"><span class="gear">𖥠</span> HaikuForge</span>
    <span class="tagline">agentic verse: haiku · tanka · guaranteed syllables</span>
  </div>
</header>
<main>
  <section class="panel">
    <h2>Forge</h2>
    <div class="chips" id="moods"></div>
    <div class="chips" id="forms"></div>
    <div class="row">
      <div class="field"><label>Theme (optional, for a line)</label>
        <input type="text" id="theme" placeholder="e.g. rain on a tin roof" value="">
      </div>
      <button class="btn" id="forge">Forge</button>
      <span class="made" id="count"></span>
    </div>
  </section>

  <section class="panel" id="results"></section>
  <section class="panel" id="favorites" hidden>
    <h2>Favorites</h2>
    <div class="grid" id="favGrid"></div>
  </section>

  <p class="foot">Generated locally — no server, no tracking. Every haiku is a strict 5‑7‑5, every tanka a strict 5‑7‑5‑7‑7, built by syllable-balanced word composition. Favorites live in this browser.</p>
</main>

<script>
const MOODS={
  serene:{emoji:'🌿',n:['moon','mist','pond','reed','heron','breeze','cloud','stone','hill','river','plum','lantern','temple','summer','water','moonlight'],v:['drifts','settles','glides','rests','shimmers','gathers','hovers','whispers'],a:['white','still','soft','pale','clear','cool','silver','quiet']},
  wistful:{emoji:'🍂',n:['leaves','rain','shade','shore','day','year','autumn','memory','letter','twilight','evening'],v:['fades','returns','lingers','waits','passes','falters'],a:['old','fading','distant','slow','broken','golden','hollow']},
  sharp:{emoji:'⚡',n:['frost','cliff','flint','wind','ice','edge','crow','steel','crest','thunder','winter'],v:['cuts','splits','rings','whips','strikes','bares','freezes','scatters'],a:['bare','cold','raw','hard','black','thin','iron','jagged']},
  warm:{emoji:'☕',n:['tea','fire','bread','wool','honey','apple','glow','kitchen','lantern','ember'],v:['warms','fills','lights','clings','hums','bakes','welcomes','smoulders'],a:['warm','ripe','soft','sweet','slow','golden','tender']},
  playful:{emoji:'🐸',n:['frog','dew','fox','mint','bean','spark','skip','puddle','leaf','whistle','pebble'],v:['hops','tumbles','chuckles','spills','glints','winks','dances','bounces'],a:['green','quick','tiny','bright','sly','light','cheeky']}
};
const FUNC=[['a',1],['the',1],['and',1],['in',1],['of',1],['at',1],['by',1],['from',1],['under',2],['into',2],['beyond',2],['over',2],['through',2],['before',2],['among',2]];
const FORMS={
  haiku:{label:'Haiku 5-7-5',t:[5,7,5],pat:[['a','n'],['a','n','v'],['a','n']]},
  tanka:{label:'Tanka 5-7-5-7-7',t:[5,7,5,7,7],pat:[['a','n'],['a','n','v'],['a','n'],['a','n','v'],['a','n']]},
  two:{label:'Couplet 5-7',t:[5,7],pat:[['a','n'],['a','n','v']]}
};
const sylMap={};
for(const m in MOODS){for(const k in MOODS[m]){if(k!=='emoji')for(const w of MOODS[m][k])sylMap[w]=w.length?Math.min(w.length>7?3:w.length>4?2:1,3):1;}}
// Explicitly correct syllable estimates (English): best effort map
const FIX={moonlight:2,heron:2,river:2,lantern:2,temple:2,summer:2,water:2,settles:2,quiets:2,shimmers:2,gathers:2,hovers:2,whispers:2,silver:2,quiet:2,autumn:2,memory:2,letter:2,twilight:2,evening:2,returns:2,lingers:2,passes:2,falters:2,fading:2,distant:2,broken:2,golden:2,hollow:2,thunder:2,winter:2,freezes:2,scatters:2,iron:2,jagged:2,kitchen:2,ember:2,welcomes:2,smoulders:2,tender:2,puddle:2,whistle:2,pebble:2,tumbles:2,chuckles:2,dances:2,bounces:2,cheeky:2,honey:2,apple:2,into:2,under:2,beyond:2,over:2,through:1,before:2,among:2,quiet:2,temple:2};
for(const w in FIX)sylMap[w]=FIX[w];
const syl=w=>sylMap[w]||1;
const pick=a=>a[Math.floor(Math.random()*a.length)];
function poolFor(mood){return [].concat(MOODS[mood].n,MOODS[mood].v,MOODS[mood].a);}
function dpFill(poolWords,remaining,avoid,max){
  const dp={0:[]};
  const arr=poolWords.slice().filter(w=>!avoid.includes(w)).sort(()=>Math.random()-0.5);
  for(let s=1;s<=remaining;s++)for(const w of arr){const c=syl(w);const r=s-c;if(r>=0&&dp[r]!==undefined&&!dp[r].includes(w)){if(dp[s]===undefined||dp[r].length+1<dp[s].length)dp[s]=[...dp[r],w];}}
  return dp[remaining]||null;
}
function line(mood,target,pattern,used){
  const cat=MOODS[mood];
  let mandatory=[];
  for(const pc of pattern){const list=cat[pc].filter(w=>!used.has(w));if(list.length)mandatory.push(pick(list));}
  const mandSyl=mandatory.reduce((a,w)=>a+syl(w),0);
  const remaining=target-mandSyl;
  if(remaining<0)return '';
  let extra=[];
  let extras=[...FUNC.map(f=>f[0]),...poolFor(mood)];
  if(remaining>0){extra=dpFill(extras,remaining,[...mandatory],40)||[];}
  if(remaining>0&&extra.length===0)return '';
  return [...mandatory,...extra].join(' ');
}
function verse(mood,formId){
  const f=FORMS[formId];
  const cat=MOODS[mood];
  const used=new Set();
  const lines=[];
  for(let i=0;i<f.t.length;i++){
    let l='';
    for(let t=0;t<40&&!l;t++){l=line(mood,f.t[i],f.pat[i],used);}
    if(!l){l=dpFill([...poolFor(mood),...FUNC.map(x=>x[0])],f.t[i],[],40).join(' ')||'';}
    lines.push(l);
    for(const w of l.split(' '))used.add(w);
  }
  return lines;
}
const state={mood:'serene',form:'haiku',favs:JSON.parse(localStorage.getItem('hf.favs')||'[]')};
function buildMoodChips(){
  const el=document.getElementById('moods');
  el.innerHTML=Object.keys(MOODS).map(m=>`<span class="chip ${m===state.mood?'on':''}" data-m="${m}">${MOODS[m].emoji} ${m}</span>`).join('');
  el.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{state.mood=c.dataset.m;buildMoodChips();});
}
function buildFormChips(){
  const el=document.getElementById('forms');
  el.innerHTML=Object.keys(FORMS).map(f=>`<span class="chip ${f===state.form?'on':''}" data-f="${f}">${FORMS[f].label}</span>`).join('');
  el.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{state.form=c.dataset.f;buildFormChips();});
}
let themeLine='';
function cardHtml(b,ownFav){
  const isFav=state.favs.some(f=>f.verse===b.verse);
  return `<div class="card">
    <div class="top"><span class="emoji">${b.emoji}</span><button class="fav ${isFav?'on':''}" data-v="${encodeURIComponent(b.verse)}">${isFav?'♥':'♡'}</button></div>
    <div class="verse">${b.verse}</div>
    <div class="meta">${b.title}</div>
    <button class="copy" data-v="${encodeURIComponent(b.verse)}">copy</button></div>`;
}
function bind(container){
  container.querySelectorAll('.fav').forEach(b=>b.onclick=()=>{
    const v=decodeURIComponent(b.dataset.v);
    const i=state.favs.findIndex(f=>f.verse===v);
    const card=b.closest('.card');
    if(i>=0)state.favs.splice(i,1);else state.favs.push({verse:v,emoji:card.querySelector('.emoji').textContent,title:card.querySelector('.meta').textContent,mood:state.mood,form:state.form});
    localStorage.setItem('hf.favs',JSON.stringify(state.favs));
    renderFavs();render();
  });
  container.querySelectorAll('.copy').forEach(b=>b.onclick=()=>{navigator.clipboard?.writeText(decodeURIComponent(b.dataset.v));b.textContent='copied!';setTimeout(()=>b.textContent='copy',900);});
}
function render(){
  themeLine=document.getElementById('theme').value.trim();
  const pool=[];
  for(let i=0;i<4;i++)pool.push(assemble());
  const r=document.getElementById('results');
  r.innerHTML=`<h2>Freshly forged</h2><div class="grid">${pool.map(b=>cardHtml(b)).join('')}</div>`;
  bind(r);
  document.getElementById('count').textContent=pool.length+' forged';
}
function rollLine(){
  const cat=MOODS[state.mood];
  const word=pick(cat.n);
  const place=pick(['under','in','beyond','beneath','at','by']);
  const o2=pick(['the',pick(cat.n)]);
  return [place,word,o2].join(' ');
}
function assemble(){
  const lines=verse(state.mood,state.form);
  if(themeLine){
    // optionally weave theme into first line if it fits
    const tSyl=themeLine.split(' ').reduce((a,w)=>a+syl(w),0);
    if(tSyl<=FORMS[state.form].t[0]){lines[0]=[themeLine,...lines[0].split(' ')].slice(0,10).join(' ');}
  }
  const label=FORMS[state.form].label;
  const counts=lines.map(l=>l?l.split(' ').reduce((a,w)=>a+syl(w),0):0);
  return {emoji:MOODS[state.mood].emoji,title:state.mood+' '+state.form+' · ['+counts.join('-')+']',verse:lines.join('\n')};
}
function renderFavs(){
  const el=document.getElementById('favGrid');
  if(state.favs.length===0){document.getElementById('favorites').hidden=true;return;}
  document.getElementById('favorites').hidden=false;
  el.innerHTML=state.favs.map(b=>cardHtml(b)).join('');
  bind(el);
}
document.getElementById('forge').onclick=render;
document.getElementById('theme').addEventListener('keydown',e=>{if(e.key==='Enter')render();});
buildMoodChips();buildFormChips();render();renderFavs();
</script>
</body>
</html>
