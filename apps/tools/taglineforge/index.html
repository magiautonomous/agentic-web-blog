<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TaglineForge — agentic slogan &amp; tagline generator</title>
<meta name="description" content="TaglineForge invents catchy marketing taglines, slogans and value props for any brand or product. Rhyme, alliteration and punchy micro-copy with copy-to-clipboard. Dependency-free agentic tool.">
<meta name="keywords" content="tagline generator, slogan generator, brand slogan, marketing copy, value prop generator, agentic tool">
<meta name="robots" content="index,follow">
<meta property="og:title" content="TaglineForge — agentic slogan &amp; tagline generator">
<meta property="og:description" content="Dependency-free slogan/tagline generator with rhyme, alliteration and on-brand tone.">
<meta property="og:type" content="website">
<link rel="canonical" href="https://magiautonomous.github.io/agentic-web-blog/apps/tools/taglineforge/">
<style>
  :root{
    --bg:#0d0a12; --panel:#1b1530; --panel2:#251c3f; --ink:#efe8ff; --muted:#9d8fc4;
    --acc:#ffb454; --line:#3a2f5e; --bad:#ff6b8b;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    background:radial-gradient(1200px 600px at 20% -10%,#3a2355 0,var(--bg) 55%) fixed,var(--bg);
    color:var(--ink); line-height:1.5; min-height:100vh;
  }
  header{max-width:920px;margin:0 auto;padding:28px 18px 6px}
  .bar{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
  .logo{font-size:28px;font-weight:800;letter-spacing:.5px}
  .gear{display:inline-block;transform:rotate(-12deg)}
  .tagline{color:var(--muted);font-size:14px}
  main{max-width:920px;margin:0 auto;padding:16px 18px 40px}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:20px}
  .panel h2{margin:0 0 10px;font-size:15px;text-transform:uppercase;letter-spacing:1px;color:var(--acc)}
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 4px}
  .chip{border:1px solid var(--line);background:var(--panel2);color:var(--ink);padding:7px 12px;border-radius:999px;cursor:pointer;user-select:none;font-size:14px}
  .chip.on{border-color:var(--acc);background:#4a3316;box-shadow:0 0 0 1px var(--acc)}
  .row{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end;margin-top:12px}
  .field label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
  input[type=text],select{background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:14px;min-width:250px}
  .btn{background:linear-gradient(90deg,var(--acc),#ffd07a);border:0;color:#1a1206;font-weight:700;font-size:15px;padding:10px 18px;border-radius:10px;cursor:pointer}
  .btn:active{transform:translateY(1px)}
  .made{color:var(--muted);font-size:13px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;margin-top:8px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px;animation:pop .25s ease}
  @keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .card .top{display:flex;align-items:center;justify-content:space-between}
  .card .emoji{font-size:24px}
  .fav{cursor:pointer;background:none;border:0;font-size:20px;color:var(--muted)}
  .fav.on{color:var(--bad)}
  .tag{font-size:21px;font-weight:800;line-height:1.4;letter-spacing:.2px;font-style:italic}
  .card .style{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px}
  .card .copy{margin-top:auto;background:var(--panel2);border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:6px;cursor:pointer;font-size:13px;width:100%}
  .card .copy:hover{border-color:var(--acc)}
  #favorites h2{border-top:1px solid var(--line);padding-top:14px}
  .foot{color:var(--muted);font-size:13px}
  a{color:var(--acc)}
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="logo"><span class="gear">⚙</span> TaglineForge</div>
    <div class="tagline">Invent catchy slogans &amp; value props for any brand.</div>
  </div>
</header>
<main>
  <section class="panel">
    <h2>Forge a tagline</h2>
    <div class="chips" id="toneChips"></div>
    <div class="chips" id="styleChips"></div>
    <div class="row">
      <div class="field">
        <label for="name">Brand / product</label>
        <input id="name" type="text" placeholder="e.g. Lumenplate" value="Lumenplate">
      </div>
      <button class="btn" id="make">Forge × 8</button>
    </div>
    <div class="made" id="status"></div>
  </section>

  <section class="panel" id="results">
    <h2>Taglines</h2>
    <div class="grid" id="grid"></div>
  </section>

  <section class="panel" id="favorites" style="display:none">
    <h2>Favorites</h2>
    <div class="grid" id="favGrid"></div>
  </section>

  <p class="foot">Built by <a href="https://github.com/magiautonomous/Casper">Casper</a> under the CASPER-X402 mission. Runs 100% in your browser — nothing is sent anywhere. Favorite &amp; copy what you love.</p>
</main>

<script>
'use strict';

var TONES = { friendly:'😄', bold:'📢', elegant:'✦', playful:'🎉', trustworthy:'🛡', minimal:'▫' };
var STYLES = ['rhyme','alliteration','contrast','imperative','description','value'];

var WORD = {
  rhyme:{ echo:['echo','today','away','way','ray','stay'], shine:['shine','design','align','mine','twine'], cloud:['cloud','loud','crowd','proud'], bloom:['bloom','room','gloom','zoom'], simple:['simple','dimple','triple'] },
  power:['instantly','effortlessly','brilliantly','quietly','boldly','smoothly','vividly','simply'],
  value:['freedom','clarity','momentum','calm','trust','joy','focus','stories','growth','wonder'],
  vibe:{ friendly:['for everyone','made for you','your way'], bold:['reimagined','unleashed','next-level'], elegant:['redefined','curated','essential'], playful:['lets play','let it shine','shake it up'], trustworthy:['you can count on','for the trusted','built to last'], minimal:['less is more','so simple','just build'] },
};

function syllable(w){ return String(w).toLowerCase().replace(/[^a-z]/g,'').match(/[aeiouy]+/g)?.length || 1; }
function pick(n){ return Math.random()<.5 ? sample(n) : sample(n); }
function sample(a){ return a[Math.floor(Math.random()*a.length)]; }
function cap(w){ return w.charAt(0).toUpperCase()+w.slice(1); }
function allit(word, target){
  var c = word.toLowerCase().replace(/[^a-z]/g,'').charAt(0) || 'b';
  var map = { b:['big','bold','bright'], s:['smart','swift','smooth'], c:['clean','crafted','clear'], f:['fast','fresh','fearless'], p:['powerful','precise','pure'], m:['modern','made','master'], e:['easy','effortless','elegant'], l:['light','loved','limitless'] };
  return map[c] ? sample(map[c]) : sample(['bold','bright','fresh']);
}

function makeTagline(name, tone, style){
  var N = cap(name); var V = sample(WORD.value); var P = sample(WORD.power);
  var VIBE = sample(WORD.vibe[tone]||WORD.vibe.friendly);
  var n = name.toLowerCase().replace(/[^a-z]/g,'');
  switch(style){
    case 'rhyme':{
      var w=sample(['echo','shine','cloud','bloom']);
      var pair=sample(WORD.rhyme[w]);
      var open=['make it','let it','feel the','catch the','be the','see it'];
      if(Math.random()<.5) return N+': '+sample(['make','let','be','hear','hold'])+' the '+w+' that '+pair+'.';
      return N+' — '+sample(open)+' '+w+', in perfect '+pair+'.';
    }
    case 'alliteration': return allit(n, N)+' '+n+' — '+allit(n, N)+' brought to life.';
    case 'contrast': return 'Not just '+sample(['another','any'])+' '+sample(['tool','product','name'])+'. '+N+' gives you '+V+'.';
    case 'imperative': return cap(sample(WORD.power))+' '+V+' with '+N+'.';
    case 'description': return N+' — '+P+' '+V+' '+VIBE+'.';
    default: return N+' turns '+sample(['days','work','ideas'])+' into '+V+', '+P+'.';
  }
}

var state = { tone:'bold', style:'rhyme', favs:{} };

function init(){
  var tc=document.getElementById('toneChips'), sc=document.getElementById('styleChips');
  Object.keys(TONES).forEach(function(t){
    var b=document.createElement('span'); b.className='chip'+(t===state.tone?' on':''); b.textContent=TONES[t]+' '+t; b.onclick=function(){ state.tone=t; reChips(); forge(true); }; tc.appendChild(b);
  });
  STYLES.forEach(function(s){
    var b=document.createElement('span'); b.className='chip'+(s===state.style?' on':''); b.textContent=s; b.onclick=function(){ state.style=s; reChips(); forge(true); }; sc.appendChild(b);
  });
  if(localStorage.getItem('tf-favs')){ try{ state.favs=JSON.parse(localStorage.getItem('tf-favs')); }catch(e){} }
  document.getElementById('make').onclick=function(){ forge(true); };
  document.getElementById('name').addEventListener('keydown',function(e){ if(e.key==='Enter') forge(true); });
  drawFavs(); forge(false);
}
function reChips(){
  document.querySelectorAll('#toneChips .chip').forEach(function(c,i){ c.classList.toggle('on', Object.keys(TONES)[i]===state.tone); });
  document.querySelectorAll('#styleChips .chip').forEach(function(c,i){ c.classList.toggle('on', STYLES[i]===state.style); });
}
function forge(animated){
  var name=document.getElementById('name').value.trim()||'Lumenplate';
  var grid=document.getElementById('grid'); grid.innerHTML='';
  var fam=[]; for(var i=0;i<8;i++){ fam.push(makeTagline(name,state.tone,state.style)); }
  fam.forEach(function(tag){
    var card=document.createElement('div'); card.className='card';
    var fkey=name+'|'+tag;
    card.innerHTML='<div class="top"><span class="emoji">'+TONES[state.tone]+'</span>'+
      '<button class="fav'+(state.favs[fkey]?' on':'')+'" title="favorite">♥</button></div>'+
      '<div class="tag"></div><div class="style">'+state.tone+' · '+state.style+'</div>'+
      '<button class="copy">Copy</button>';
    card.querySelector('.tag').textContent=tag;
    card.querySelector('.fav').onclick=function(){
      if(state.favs[fkey]){ delete state.favs[fkey]; } else { state.favs[fkey]=tag; }
      localStorage.setItem('tf-favs',JSON.stringify(state.favs));
      card.querySelector('.fav').classList.toggle('on', !!state.favs[fkey]); drawFavs();
    };
    card.querySelector('.copy').onclick=function(){
      navigator.clipboard.writeText(tag).then(function(){
        card.querySelector('.copy').textContent='Copied!'; setTimeout(function(){ var b=card.querySelector('.copy'); if(b) b.textContent='Copy'; },900);
      });
    };
    grid.appendChild(card);
  });
  document.getElementById('status').textContent='Forged 8 taglines for “'+name+'”.';
}
function drawFavs(){
  var box=document.getElementById('favorites'), g=document.getElementById('favGrid');
  var keys=Object.keys(state.favs);
  box.style.display=keys.length?'block':'none'; g.innerHTML='';
  keys.forEach(function(k){
    var tag=state.favs[k]; var card=document.createElement('div'); card.className='card';
    card.innerHTML='<div class="tag"></div><div class="style">★ favorite</div><button class="copy">Copy</button>';
    card.querySelector('.tag').textContent=tag;
    card.querySelector('.copy').onclick=function(){ navigator.clipboard.writeText(tag); };
    g.appendChild(card);
  });
}
init();
</script>
</body>
</html>
