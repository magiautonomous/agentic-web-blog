<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IpsumForge — Lorem Ipsum Generator</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0d1117;color:#c9d1d9;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:2rem 1rem}
h1{font-size:2rem;margin-bottom:.3rem}
.sub{color:#8b949e;margin-bottom:2rem;font-size:.95rem}
.card{background:#161b22;border:1px solid #30363d;border-radius:12px;padding:1.5rem;width:100%;max-width:720px;margin-bottom:1.5rem}
label{display:block;font-size:.85rem;color:#8b949e;margin-bottom:.4rem}
select,input[type=number]{width:100%;padding:.55rem .75rem;background:#0d1117;border:1px solid #30363d;border-radius:6px;color:#c9d1d9;font-size:1rem;margin-bottom:1rem}
.row{display:flex;gap:1rem}
.row>div{flex:1}
button{background:#238636;border:none;color:#fff;padding:.65rem 1.4rem;border-radius:6px;font-size:1rem;cursor:pointer;font-weight:600}
button:hover{background:#2ea043}
button.secondary{background:#30363d}
button.secondary:hover{background:#3d444d}
.btn-row{display:flex;gap:.75rem;margin-top:1rem}
#output{background:#0d1117;border:1px solid #30363d;border-radius:8px;padding:1.25rem;line-height:1.6;font-size:1rem;margin-top:1rem;white-space:pre-wrap}
#output p{margin-bottom:1rem}
.toast{position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%);background:#238636;color:#fff;padding:.5rem 1.2rem;border-radius:8px;font-size:.9rem;display:none;z-index:100}
</style>
</head>
<body>

<h1>&#x1f4dd; IpsumForge</h1>
<p class="sub">lorem ipsum &amp; themed filler text generator &mdash; runs entirely in your browser</p>

<div class="card">
  <label>Style</label>
  <select id="theme">
    <option value="">Classic Lorem Ipsum</option>
    <option value="tech">Tech</option>
    <option value="startup">Startup / VC</option>
    <option value="nature">Nature</option>
    <option value="cyber">Cyber / Security</option>
  </select>
  <div class="row">
    <div>
      <label>Paragraphs (1–20)</label>
      <input type="number" id="paragraphs" value="3" min="1" max="20">
    </div>
    <div>
      <label>Sentences / paragraph (1–10)</label>
      <input type="number" id="sentences" value="5" min="1" max="10">
    </div>
  </div>
  <div class="btn-row">
    <button onclick="generate()">Generate</button>
    <button class="secondary" onclick="copyText()">Copy text</button>
  </div>
  <div id="output"></div>
</div>

<div class="toast" id="toast">Copied!</div>

<script src="ipsum-engine.js"></script>
<script>
var lastHtml = '';
function copyClipboard(text) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(function(){ showToast(); });
  } else {
    var ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    showToast();
  }
}
function showToast() {
  var t = document.getElementById('toast');
  t.style.display = 'block';
  setTimeout(function(){ t.style.display = 'none'; }, 1200);
}
function generate() {
  var theme = document.getElementById('theme').value || null;
  var paragraphs = parseInt(document.getElementById('paragraphs').value) || 3;
  var sentences = parseInt(document.getElementById('sentences').value) || 5;
  var result = IpsumEngine.generate({ theme: theme, paragraphs: paragraphs, sentences: sentences });
  var html = result.paragraphs.map(function(p){ return '<p>' + p + '</p>'; }).join('');
  lastHtml = html;
  document.getElementById('output').innerHTML = html;
}
function copyText() {
  if (!lastHtml) return;
  var text = lastHtml.replace(/<p>/g, '\n').replace(/<\/p>/g, '\n').replace(/\n+/g, '\n').replace(/^\n|\n$/g, '');
  copyClipboard(text);
}
generate();
</script>
</body>
</html>
